[project]
name = "omotes-sdk-python"
requires-python = ">=3.11"
dynamic = ["version"]
authors = [
    { name = "Mark Vrijlandt", email = "mark.vrijlandt@tno.nl" },
    { name = "Cheng-Kai Wang", email = "cheng-kai.wang@tno.nl" },
    { name = "Sebastiaan la Fleur", email = "sebastiaan.lafleur@tno.nl" }
]
description = "Python implementation of the OMOTES SDK through jobs which may be submitted, receive status updates for submitted jobs or delete submitted jobs."
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "prefect==3.7.3",
    "s3fs",
    "streamcapture ~= 1.2.5",
    "typing-extensions ~= 4.11",
]

[dependency-groups]
dev = [
    "setuptools ~= 75.6.0",
    "wheel ~= 0.45.1",
    "setuptools-git-versioning >= 2.0, < 3",
    "pytest ~= 8.3.4",
    "pytest-cov ~= 6.0.0",
    "ruff ~= 0.15.22",
    "ty ~= 0.0.61",
    "isort == 5.13.2",
    "build ~= 1.2.2",
]

[project.urls]
homepage = "https://www.nwn.nu"
documentation = "https://readthedocs.org"
repository = "https://github.com/Nieuwe-Warmte-Nu/omotes-sdk-python"
changelog = "https://github.com/Nieuwe-Warmte-Nu/omotes-sdk-python/blob/main/CHANGELOG.md"

[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools ~= 75.6.0",
    "wheel ~= 0.45.1",
    "setuptools-git-versioning >= 2.0, < 3",
]

[tool.setuptools.package-data]
"omotes_sdk" = ["py.typed"]

[tool.setuptools-git-versioning]
enabled = true
starting_version = "0.0.1"

[tool.pytest.ini_options]
addopts = "--cov=omotes_sdk --cov-report html --cov-report term-missing --cov-fail-under 10"

[tool.coverage.run]
source = ["src"]
omit = [
    # omit generated code from protobuf
    "*_pb2.py",
]

[tool.ruff]
line-length = 120
preview = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",
    "F",   # Pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "I",   # isort
    "D",   # pydocstyle
    "ANN", # flake8-annotations
    "DOC", # flake8-docstrings
    "S",   # flake8-bandit
]
ignore = [
    "D100", # Missing docstring in public module
    "D104", # Missing docstring in public package
]
exclude = ["justfile", ".editorconfig"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert statements are standard in tests
